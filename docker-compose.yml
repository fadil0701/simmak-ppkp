name: simmak-ppkp

x-app: &app
  image: simmak-ppkp/app:latest
  # SATU file env untuk semua lingkungan: .env (lihat .env.example).
  # Nilai khusus container di-override di sini; Laravel tidak menimpa
  # environment variable yang sudah ada, jadi override ini yang menang.
  environment:
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_DATABASE: simmak_ppkp
    DB_USERNAME: simmak
    DB_PASSWORD: ${POSTGRES_PASSWORD:-simmak_secret}
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    CLAMAV_HOST: clamav
    CLAMAV_PORT: "3310"
    APP_URL: http://localhost:8080
    HOME: /home/www-data
    XDG_CONFIG_HOME: /home/www-data/.config
  volumes:
    - .:/var/www/html:cached
    - vendor:/var/www/html/vendor
  working_dir: /var/www/html
  networks:
    - app_net

x-worker: &worker
  <<: *app
  depends_on:
    app:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: simmak_ppkp
      POSTGRES_USER: simmak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-simmak_secret}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simmak -d simmak_ppkp"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - app_net

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_net

  clamav:
    image: docker.io/clamav/clamav:latest
    command: ["clamd", "--foreground"]
    volumes:
      - clamav_data:/var/lib/clamav
    ports:
      - "${CLAMAV_PORT:-3310}:3310"
    healthcheck:
      test: ["CMD", "clamdscan", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - app_net

  assets:
    image: node:22-bookworm-slim
    profiles: ["tools"]
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html:cached
      - node_modules:/var/www/html/node_modules
    command: sh -c "npm ci && npm run build"
    networks:
      - app_net

  app:
    <<: *app
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - edge_net
      - app_net

  queue:
    <<: *worker
    command: gosu www-data php artisan queue:work --sleep=3 --tries=3 --timeout=120 --verbose
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: simmak_ppkp
      DB_USERNAME: simmak
      DB_PASSWORD: ${POSTGRES_PASSWORD:-simmak_secret}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      APP_URL: http://localhost:8080
      HOME: /home/www-data
      XDG_CONFIG_HOME: /home/www-data/.config
      RUN_MIGRATIONS: "false"

  scheduler:
    <<: *worker
    command: gosu www-data php artisan schedule:work
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: simmak_ppkp
      DB_USERNAME: simmak
      DB_PASSWORD: ${POSTGRES_PASSWORD:-simmak_secret}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      APP_URL: http://localhost:8080
      HOME: /home/www-data
      XDG_CONFIG_HOME: /home/www-data/.config
      RUN_MIGRATIONS: "false"

volumes:
  pg_data:
  redis_data:
  clamav_data:
  vendor:
  node_modules:

networks:
  edge_net:
  app_net:
    driver: bridge