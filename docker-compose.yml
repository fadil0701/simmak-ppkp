services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: simmak-ppkp/app:latest
    env_file:
      - .env
    volumes:
      - .:/var/www/html
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app_net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - edge_net
      - app_net

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_net

  queue-worker:
    image: simmak-ppkp/app:latest
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=120
    env_file:
      - .env
    volumes:
      - .:/var/www/html
    depends_on:
      - app
      - redis
    networks:
      - app_net

  scheduler:
    image: simmak-ppkp/app:latest
    command: php artisan schedule:work
    env_file:
      - .env
    volumes:
      - .:/var/www/html
    depends_on:
      - app
    networks:
      - app_net

volumes:
  redis_data:

networks:
  edge_net:
  app_net:
    driver: bridge
