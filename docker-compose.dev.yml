services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: simmak_ppkp
      POSTGRES_USER: simmak
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pg_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simmak -d simmak_ppkp"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_net

  app:
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data_dev:
